[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "neujoh-img"
version = "0.1.0"
description = "Structure-aware color ASCII art renderer with OKLab color and directional edges"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "src/neujoh/fonts/OFL.txt"]
authors = [
  { name = "emjdp" },
]
keywords = [
  "ascii-art",
  "color-ascii-art",
  "image-processing",
  "oklab",
  "terminal-art",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Artistic Software",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<6",
  "Pillow>=10.4,<13",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
matte = [
  "onnxruntime>=1.20,<2",
  "rembg>=2.0.60,<3",
]

[project.scripts]
neujoh = "neujoh.cli:main"

[project.urls]
Homepage = "https://github.com/emjdp/NEUJOH.img"
Repository = "https://github.com/emjdp/NEUJOH.img.git"
Issues = "https://github.com/emjdp/NEUJOH.img/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neujoh = ["fonts/*.ttf", "fonts/*.txt", "fonts/*.md"]
